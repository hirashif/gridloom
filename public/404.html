<!doctype html>
<!--
  Gridloom 404 — hand-built STATIC mirror of src/pages/NotFoundPage.tsx.
  These two files MUST stay visually in sync. This one is served by
  Cloudflare Pages for hard 404s (direct hits on unknown paths before the
  SPA boots); the React version renders for client-side unknown routes.
  Self-contained by rule: inline styles + keyframes, fonts via same-origin
  @font-face only — NEVER a CDN / Google Fonts link (keys-and-requests
  never-leave-the-browser privacy rule). Light-only: hexes are hardcoded.
-->
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="robots" content="noindex" />
    <meta name="theme-color" content="#F7F4ED" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>This frame didn't develop. | Gridloom</title>
    <style>
      @font-face {
        font-family: 'Newsreader';
        font-style: normal;
        font-display: swap;
        font-weight: 200 800;
        src: url('/fonts/newsreader-latin-wght-normal.woff2') format('woff2-variations');
      }
      :root {
        --sans: 'Instrument Sans', system-ui, -apple-system, sans-serif;
        --display: 'Newsreader', Georgia, 'Times New Roman', serif;
        --mono: 'JetBrains Mono', ui-monospace, SFMono-Regular, Menlo, monospace;
        --hand: 'Caveat', 'Segoe Print', 'Bradley Hand', cursive;
      }
      * { box-sizing: border-box; }
      body {
        margin: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        padding: 40px 24px;
        background: #F7F4ED;
        color: #241F18;
        font-family: var(--sans);
        -webkit-font-smoothing: antialiased;
      }
      @keyframes glDash { to { stroke-dashoffset: 0; } }
      @keyframes glRise { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }
      .sheet {
        background: radial-gradient(120% 160% at 50% -10%, #FFFEF8 0%, #F4EEDC 45%, #E7DEC4 100%);
        border: 1px solid rgba(50, 42, 32, 0.16);
        border-radius: 10px;
        box-shadow: inset 0 2px 14px rgba(255, 255, 255, 0.9), inset 0 -8px 24px rgba(120, 100, 60, 0.12), 0 18px 40px -16px rgba(60, 48, 24, 0.35);
        padding: 16px 18px 14px;
        transform: rotate(-1.5deg);
        animation: glRise 0.6s 0.1s cubic-bezier(0.2, 0.7, 0.3, 1) both;
      }
      .sheet-head {
        display: flex;
        justify-content: space-between;
        align-items: center;
        margin: 0 0 10px;
      }
      .sheet-code { font-family: var(--mono); font-size: 10px; letter-spacing: 0.14em; color: #8A7C5E; }
      .sheet-note { font-family: var(--hand); font-size: 17px; color: #241F18; transform: rotate(-2deg); }
      .grid { display: grid; grid-template-columns: repeat(3, 86px); gap: 8px; }
      .cell { aspect-ratio: 1; border-radius: 3px; border: 1px solid rgba(50, 42, 32, 0.2); }
      .miss {
        position: relative;
        aspect-ratio: 1;
        border-radius: 3px;
        border: 1.5px dashed rgba(232, 72, 58, 0.6);
        display: flex;
        align-items: center;
        justify-content: center;
      }
      .miss span { font-family: var(--mono); font-size: 13px; font-weight: 600; color: #E8483A; }
      .miss svg { position: absolute; inset: -10px; width: calc(100% + 20px); height: calc(100% + 20px); overflow: visible; pointer-events: none; }
      h1 {
        font-family: var(--display);
        font-weight: 500;
        font-size: 40px;
        letter-spacing: -0.01em;
        margin: 38px 0 0;
        text-align: center;
        animation: glRise 0.6s 0.25s cubic-bezier(0.2, 0.7, 0.3, 1) both;
      }
      .body {
        font-size: 16px;
        line-height: 1.6;
        color: #5C5344;
        max-width: 42ch;
        text-align: center;
        margin: 12px 0 0;
        animation: glRise 0.6s 0.35s cubic-bezier(0.2, 0.7, 0.3, 1) both;
      }
      .actions {
        display: flex;
        flex-wrap: wrap;
        justify-content: center;
        gap: 14px;
        margin: 28px 0 0;
        animation: glRise 0.6s 0.45s cubic-bezier(0.2, 0.7, 0.3, 1) both;
      }
      .btn {
        padding: 13px 24px;
        border-radius: 999px;
        font-size: 14.5px;
        font-weight: 600;
        text-decoration: none;
      }
      .btn-primary { background: #D23B2E; color: #FFF6F0; box-shadow: 0 2px 0 rgba(36, 31, 24, 0.25); }
      .btn-secondary { background: #FFFDF6; color: #241F18; border: 1px solid rgba(50, 42, 32, 0.2); }
      .footer-joke {
        font-family: var(--mono);
        font-size: 11px;
        color: #8C8069;
        margin: 26px 0 0;
        text-align: center;
        animation: glRise 0.6s 0.55s cubic-bezier(0.2, 0.7, 0.3, 1) both;
      }
      @media (prefers-reduced-motion: reduce) {
        *, *::before, *::after { animation-duration: 0.01ms !important; animation-delay: 0ms !important; }
        .miss svg path { stroke-dashoffset: 0 !important; }
      }
    </style>
  </head>
  <body>
    <div class="sheet">
      <div class="sheet-head">
        <span class="sheet-code">GRIDLOOM · SHEET 404</span>
        <span class="sheet-note">where'd it go?</span>
      </div>
      <div class="grid">
        <div class="cell" style="background: linear-gradient(135deg, #D9A05B, #8C5A2E 60%, #3E2A18)"></div>
        <div class="cell" style="background: linear-gradient(140deg, #B9C49A, #6E7C4C 60%, #333D22)"></div>
        <div class="cell" style="background: linear-gradient(150deg, #9AB3C4, #4C6E7C 60%, #22333D)"></div>
        <div class="cell" style="background: linear-gradient(160deg, #E8C285, #A06A32 55%, #57381C)"></div>
        <div class="miss">
          <span>404</span>
          <svg viewBox="0 0 100 100" aria-hidden="true">
            <path d="M50 8 C 82 4, 98 24, 94 52 C 90 82, 60 98, 32 92 C 8 86, 0 60, 8 36 C 16 14, 34 6, 62 8" fill="none" stroke="#E8483A" stroke-width="3" stroke-linecap="round" stroke-dasharray="330" stroke-dashoffset="330" style="animation: glDash 0.9s 0.8s ease-out forwards" />
          </svg>
        </div>
        <div class="cell" style="background: linear-gradient(170deg, #D2D8B0, #889460 55%, #49502E)"></div>
      </div>
    </div>

    <h1>This frame didn't develop.</h1>
    <p class="body">
      The page you're after isn't on any of our contact sheets. It may have been moved, renamed, or never shot at all.
    </p>
    <div class="actions">
      <a class="btn btn-primary" href="/">Back to the homepage</a>
      <a class="btn btn-secondary" href="/generate">Open the studio</a>
    </div>
    <p class="footer-joke">error 404 · no request left your browser while looking for it, obviously</p>
  </body>
</html>

<x-dc>
<helmet data-dc-atomics>
<link rel="preconnect" href="https://fonts.googleapis.com">

<style>
body{margin:0;background:#F7F4ED;font-family:'Instrument Sans',system-ui,sans-serif;-webkit-font-smoothing:antialiased}

<div data-screen-label="404" style="min-height:100vh;display:flex;flex-direction:column;align-items:center;justify-content:center;color:#241F18;padding:40px 24px;box-sizing:border-box">

    </div>
    <div style="display:grid;grid-template-columns:repeat(3,86px);gap:8px">
      <div style="aspect-ratio:1;border-radius:3px;border:1px solid rgba(50,42,32,.2);background:linear-gradient(135deg,#D9A05B,#8C5A2E 60%,#3E2A18)"></div>

      <div style="aspect-ratio:1;border-radius:3px;border:1px solid rgba(50,42,32,.2);background:linear-gradient(160deg,#E8C285,#A06A32 55%,#57381C)"></div>
      <div style="position:relative;aspect-ratio:1;border-radius:3px;border:1.5px dashed rgba(232,72,58,.6);display:flex;align-items:center;justify-content:center">
        <span style="font-family:'JetBrains Mono',monospace;font-size:13px;font-weight:600;color:#E8483A">404</span>
        <svg viewBox="0 0 100 100" style="position:absolute;inset:-10px;width:calc(100% + 20px);height:calc(100% + 20px);overflow:visible;pointer-events:none"><path d="M50 8 C 82 4, 98 24, 94 52 C 90 82, 60 98, 32 92 C 8 86, 0 60, 8 36 C 16 14, 34 6, 62 8" fill="none" stroke="#E8483A" stroke-width="3" stroke-linecap="round" stroke-dasharray="330" stroke-dashoffset="330" style="animation:glDash .9s .8s ease-out forwards"></path></svg>
      </div>
      <div style="aspect-ratio:1;border-radius:3px;border:1px solid rgba(50,42,32,.2);background:linear-gradient(170deg,#D2D8B0,#889460 55%,#49502E)"></div>
    </div>
  </div>

  <p style="font-size:16px;line-height:1.6;color:#5C5344;max-width:42ch;text-align:center;margin:12px 0 0;animation:glRise .6s .35s cubic-bezier(.2,.7,.3,1) both">The page you're after isn't on any of our contact sheets. It may have been moved, renamed, or never shot at all.</p>
  <div style="display:flex;gap:14px;margin:28px 0 0;animation:glRise .6s .45s cubic-bezier(.2,.7,.3,1) both">
    <a href="Gridloom Landing.dc.html" style="background:#D23B2E;color:#FFF6F0;padding:13px 24px;border-radius:999px;font-size:14.5px;font-weight:600;text-decoration:none;box-shadow:0 2px 0 rgba(36,31,24,.25)" style-hover="background:#B32A1F">Back to the homepage</a>
    <a href="Gridloom Studio.dc.html" style="background:#FFFDF6;color:#241F18;padding:13px 22px;border-radius:999px;font-size:14.5px;font-weight:600;text-decoration:none;border:1px solid rgba(50,42,32,.2)" style-hover="border-color:#241F18">Open the studio</a>
  </div>
  <div style="font-family:'JetBrains Mono',monospace;font-size:11px;color:#8C8069;margin:26px 0 0;animation:glRise .6s .55s cubic-bezier(.2,.7,.3,1) both">error 404 · no request left your browser while looking for it, obviously</div>
